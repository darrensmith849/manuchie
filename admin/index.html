<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Manuchie</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/overview"><img class="brand-logo" src="/admin/logo.svg" alt="Manuchie" width="176" height="20" /><span class="brand-k">Dashboard</span></a>
      <button class="btn btn-ghost" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
    </header>
    <div class="scrim" id="scrim" hidden></div>

    <aside class="side" id="side" aria-label="Dashboard">
      <a class="brand" href="#/overview"><img class="brand-logo" src="/admin/logo.svg" alt="Manuchie" width="176" height="20" /><span class="brand-k">Dashboard</span></a>
      <nav class="nav" aria-label="Sections">
        <a href="#/overview" data-route="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Overview</a>
        <a href="#/analytics" data-route="analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 19h16v2H2V3h2zm3-3 4-5 3 3 5-7 1.6 1.2-6.4 9-3-3-2.8 3.5z"/></svg>Analytics</a>
        <a href="#/enquiries" data-route="enquiries"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 4-8 5-8-5V6l8 5 8-5z"/></svg>Enquiries<span class="badge" id="unreadBadge" hidden></span></a>
        <a href="#/contacts" data-route="contacts"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4m-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3m0 2c-2.3 0-7 1.2-7 3.5V19h7v-2.5c0-.9.4-1.8 1.1-2.6A11 11 0 0 0 8 13m8 0c-2.9 0-8 1.5-8 4.4V19h16v-1.6c0-2.9-5.1-4.4-8-4.4"/></svg>Contacts</a>
        <a href="#/consent" data-route="consent"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg>Marketing consent</a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <span class="side-user" id="whoami"></span>
        <div class="nav"><button type="button" id="logoutBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 17v-3H3v-4h7V7l5 5zm2-15h7a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-7v-2h7V4h-7z"/></svg>Log out</button></div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <p class="loading">Loading…</p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="actions">
        <button class="btn btn-danger" value="ok" id="confirmOk"></button>
        <button class="btn" value="cancel" autofocus>Cancel</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/app.js" defer></script>
</body>
</html>
